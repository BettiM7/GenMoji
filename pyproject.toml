[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genmoji"
version = "0.1.0"
description = "Text-to-emoji generation experiments and shared OpenMoji data preparation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
data = [
    "CairoSVG>=2.7,<3",
    "defusedxml>=0.7,<1",
    "Pillow>=11,<13",
    "datasets>=3,<5",
]
diffusion = [
    "torch>=2.2,<3",
    "torchvision>=0.17,<1",
    "diffusers==0.35.1",
    "transformers>=4.41,<5",
    "accelerate>=1.2,<2",
    "peft>=0.17,<0.18",
    "datasets>=3,<5",
    "Pillow>=11,<13",
    "safetensors>=0.4,<1",
    "tensorboard>=2.16,<3",
]

[project.scripts]
genmoji = "genmoji.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
